<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rangsit water level</title>
<style>
:root{--bg:#eef1ec;--ink:#1c2b24;--muted:#5d6d64;--line:#d3dad2;--surface:#fff;--green:#5f8a3a;--yellow:#e8b91c;--orange:#c9582a;--red:#c4202a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--ink:#e8efe9;--muted:#9bab9f;--line:#2f3d35;--surface:#1b2620;--green:#7fb04f;--yellow:#f0c53a;--orange:#e0713f;--red:#e5424c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Thai",sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
#hero{border-radius:10px;padding:22px 18px;color:#fff;background:var(--muted)}
#hero.yellow{color:#2a2200}
#name{font-size:clamp(2rem,8vw,3rem);font-weight:800;margin:0;line-height:1.1}
#th,#when{margin:4px 0 0}
.warn{background:var(--orange);color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none}
.strip{display:flex;gap:2px;height:26px}.strip span{flex:1;background:var(--line);border-radius:2px}
a{color:var(--ink)}h2{font-size:1.05rem;margin:0 0 8px}small{color:var(--muted)}
</style></head><body><main>
<h1>Rangsit water level</h1>
<div id="stale" class="warn" role="alert"></div>
<div id="hero"><p id="name">Loading…</p><p id="th"></p><p id="when"></p></div>
<div class="card" style="margin-top:14px"><h2>Last 24 hours</h2><div class="strip" id="strip"></div><small>One block per 5-minute check, oldest on the left.</small></div>
<div class="card"><a href="https://www.ipcamlive.com/68c13eaeec104" target="_blank" rel="noopener">Open the live camera</a><br><small>The level is read automatically from the camera picture, so treat it as an estimate.</small></div>
</main>
<script>
var L={green:["Normal","ปกติ"],yellow:["Warning","เฝ้าระวัง"],orange:["High","ระดับสูง เตรียมพร้อม"],red:["Critical","วิกฤต"]};
function ago(t){var m=Math.round((Date.now()-new Date(t))/60000);return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"}
function draw(s){
  var h=document.getElementById("hero"),lv=s.level;
  if(lv&&L[lv]){h.className=lv;h.style.background="var(--"+lv+")";
    document.getElementById("name").textContent=L[lv][0];document.getElementById("th").textContent=L[lv][1];}
  else{document.getElementById("name").textContent="No reading yet";}
  document.getElementById("when").textContent=s.checked_at?"Checked "+ago(s.checked_at):"";
  var w=document.getElementById("stale"),old=s.checked_at&&(Date.now()-new Date(s.checked_at))>20*60000;
  if(old||!s.ok){w.style.display="block";w.textContent=old?"Data is more than 20 minutes old. Check the camera directly.":(s.note||"The last check failed.")}else w.style.display="none";
  var st=document.getElementById("strip");st.innerHTML="";var hist=(s.history||[]).slice(-288);
  for(var i=0;i<288;i++){var sp=document.createElement("span"),e=hist[i-(288-hist.length)];if(e&&i>=288-hist.length)sp.style.background="var(--"+e.level+")";st.appendChild(sp)}
}
function load(){fetch("status.json?"+Date.now()).then(function(r){return r.json()}).then(draw).catch(function(){document.getElementById("name").textContent="Cannot load status"})}
load();setInterval(load,60000);
</script></body></html>
